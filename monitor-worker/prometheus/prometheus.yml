global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'worker-01'
    static_configs:
      - targets: ['192.168.1.200:8000']
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: 'worker-02'
    static_configs:
      - targets: ['192.168.1.201:8001']
    metrics_path: /health
    scrape_interval: 30s

  - job_name: 'worker-03'
    static_configs:
      - targets: ['192.168.1.202:8002']
    metrics_path: /health
    scrape_interval: 30s

  - job_name: 'master'
    static_configs:
      - targets: ['192.168.1.101:9000']
    metrics_path: /metrics
    scrape_interval: 30s
