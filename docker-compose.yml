version: '3.8'

services:
  # RabbitMQ for message queue between workers
  rabbitmq:
    image: arm64v8/rabbitmq:3.9-management-alpine
    container_name: trademind-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: trademind
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: trademind
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - trademind-network
    restart: unless-stopped

  # Redis for caching and state management
  redis:
    image: arm64v8/redis:6.2-alpine
    container_name: trademind-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - trademind-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Indicator Worker - Technical analysis calculations
  indicator-worker:
    build:
      context: ./indicator-worker
      dockerfile: Dockerfile
    container_name: trademind-indicator-worker
    environment:
      - WORKER_TYPE=indicator
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=trademind
      - RABBITMQ_PASS=<TRADEMIND_XAVIER_PASSWORD>
      - RABBITMQ_VHOST=trademind
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MASTER_HOST=${MASTER_HOST:-192.168.1.100}
      - MASTER_PORT=${MASTER_PORT:-8080}
      - WORKER_ID=indicator-worker-01
      - LOG_LEVEL=INFO
    depends_on:
      - rabbitmq
      - redis
    networks:
      - trademind-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # Factor Worker - Multi-factor calculation
  factor-worker:
    build:
      context: ./factor-worker
      dockerfile: Dockerfile
    container_name: trademind-factor-worker
    environment:
      - WORKER_TYPE=factor
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=trademind
      - RABBITMQ_PASS=<TRADEMIND_XAVIER_PASSWORD>
      - RABBITMQ_VHOST=trademind
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MASTER_HOST=${MASTER_HOST:-192.168.1.100}
      - MASTER_PORT=${MASTER_PORT:-8080}
      - WORKER_ID=factor-worker-01
      - LOG_LEVEL=INFO
    depends_on:
      - rabbitmq
      - redis
    networks:
      - trademind-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # Backtest Worker - Strategy backtesting
  backtest-worker:
    build:
      context: ./backtest-worker
      dockerfile: Dockerfile
    container_name: trademind-backtest-worker
    environment:
      - WORKER_TYPE=backtest
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=trademind
      - RABBITMQ_PASS=<TRADEMIND_XAVIER_PASSWORD>
      - RABBITMQ_VHOST=trademind
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MASTER_HOST=${MASTER_HOST:-192.168.1.100}
      - MASTER_PORT=${MASTER_PORT:-8080}
      - WORKER_ID=backtest-worker-01
      - LOG_LEVEL=INFO
    depends_on:
      - rabbitmq
      - redis
    networks:
      - trademind-network
    restart: unless-stopped
    volumes:
      - backtest_results:/app/results
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # Task Agent - Job scheduling and distribution
  task-agent:
    build:
      context: ./task-agent
      dockerfile: Dockerfile
    container_name: trademind-task-agent
    environment:
      - AGENT_TYPE=task
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=trademind
      - RABBITMQ_PASS=<TRADEMIND_XAVIER_PASSWORD>
      - RABBITMQ_VHOST=trademind
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MASTER_HOST=${MASTER_HOST:-192.168.1.100}
      - MASTER_PORT=${MASTER_PORT:-8080}
      - AGENT_ID=task-agent-01
      - LOG_LEVEL=INFO
    ports:
      - "8081:8080"
    depends_on:
      - rabbitmq
      - redis
    networks:
      - trademind-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # Monitor Agent - System monitoring and health checks
  monitor-agent:
    build:
      context: ./monitor-agent
      dockerfile: Dockerfile
    container_name: trademind-monitor-agent
    privileged: true
    environment:
      - AGENT_TYPE=monitor
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=trademind
      - RABBITMQ_PASS=<TRADEMIND_XAVIER_PASSWORD>
      - RABBITMQ_VHOST=trademind
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MASTER_HOST=${MASTER_HOST:-192.168.1.100}
      - MASTER_PORT=${MASTER_PORT:-8080}
      - AGENT_ID=monitor-agent-01
      - LOG_LEVEL=INFO
    ports:
      - "8082:8080"
    depends_on:
      - rabbitmq
      - redis
    networks:
      - trademind-network
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

networks:
  trademind-network:
    driver: bridge

volumes:
  rabbitmq_data:
  redis_data:
  backtest_results:
